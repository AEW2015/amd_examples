<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 295" role="img" aria-label="HSS primary and secondary key chain for image authentication"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c80"/></marker></defs><style>.dt{font:600 18px Segoe UI,Arial;fill:#16374e}.ds{font:14px Segoe UI,Arial;fill:#425e74}.dl{font:600 24px Segoe UI,Arial;fill:#16374e}</style><g><rect x="15" y="25" width="230" height="80" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="31" y="54" class="dt">Primary public key</text><text x="31" y="77" class="ds">Owner anchor not provisioned</text></g><g><rect x="300" y="25" width="270" height="80" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="316" y="54" class="dt">Secondary public key</text><text x="316" y="77" class="ds">Signature checked under primary</text></g><g><rect x="625" y="25" width="450" height="80" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="641" y="54" class="dt">Signed hash block</text><text x="641" y="77" class="ds">Binds boot header and payload roots</text></g><g><rect x="625" y="180" width="210" height="75" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="641" y="209" class="dt">PLM payload</text><text x="641" y="232" class="ds">SHA3-256 chain</text></g><g><rect x="865" y="180" width="210" height="75" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="881" y="209" class="dt">PL payload</text><text x="881" y="232" class="ds">SHA3-256 chain</text></g><path d="M245 65 L295 65" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M570 65 L620 65" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M725 105 L725 175" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M970 105 L970 175" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><text class="ds" x="15" y="165">Boot image: two-level H15 / W2 HSS-SHAKE256</text><text class="ds" x="15" y="195">Runtime benchmark: fixed H5 / W2 vectors;</text><text class="ds" x="15" y="219">its HSS example has one level.</text><text class="ds" x="15" y="280">HSS is stateful at signing: never restore or duplicate old private signing state.</text></svg>