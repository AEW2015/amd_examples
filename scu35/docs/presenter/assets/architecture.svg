<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" role="img" aria-label="SCU35 PMC, configuration and PL application connections"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c80"/></marker></defs><style>.dt{font:600 18px Segoe UI,Arial;fill:#16374e}.ds{font:14px Segoe UI,Arial;fill:#425e74}.dl{font:600 24px Segoe UI,Arial;fill:#16374e}</style><rect x="235" y="10" width="665" height="402" rx="15" fill="#e8eef5" stroke="#92aabe"/><text class="dl" x="258" y="45">Dedicated PMC configuration and security</text><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="Configuration inputs" data-arch="JTAG carries the tested images. Other physical boot interfaces are architectural context, not tested transport alternatives here."><rect x="10" y="75" width="200" height="80" rx="9" fill="#d4eee2" stroke="#9eb5c8"/><text x="26" y="104" class="dt">Configuration inputs</text><text x="26" y="127" class="ds">JTAG used in this demo</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="BootROM + AMD PLM" data-arch="BootROM is the initial firmware trust boundary. The supplied AMD PLM is packaged in the PDI. Our custom native benchmark loader is a separate laboratory image."><rect x="258" y="70" width="285" height="80" rx="9" fill="#d6e4f5" stroke="#9eb5c8"/><text x="274" y="99" class="dt">BootROM + AMD PLM</text><text x="274" y="122" class="ds">Firmware in configuration flow</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="Configuration controller" data-arch="The configuration path initializes and loads the PL. A valid file and successful configuration are separate gates."><rect x="578" y="70" width="296" height="80" rx="9" fill="#d6e4f5" stroke="#9eb5c8"/><text x="594" y="99" class="dt">Configuration controller</text><text x="594" y="122" class="ds">Configuration control / CCU</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="AXI-MM switch" data-arch="Memory-mapped control connects services. Software control and data movement are part of measured API latency."><rect x="258" y="185" width="616" height="65" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="274" y="214" class="dt">AXI-MM switch</text><text x="274" y="237" class="ds">Control access to hardened functions</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="DMA + stream routing" data-arch="The PMC DMA moves data for crypto operations. DMA setup, completion checks and data placement still affect performance."><rect x="258" y="282" width="285" height="80" rx="9" fill="#d9e7f1" stroke="#9eb5c8"/><text x="274" y="311" class="dt">DMA + stream routing</text><text x="274" y="334" class="ds">Move buffers through engines</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="SHA3 / SHAKE / AES" data-arch="SHA3/SHAKE hash data; AES-GCM encrypts and authenticates symmetric data. LMS/HSS control logic in our native benchmark remains software."><rect x="578" y="282" width="296" height="80" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="594" y="311" class="dt">SHA3 / SHAKE / AES</text><text x="594" y="334" class="ds">Hardened cryptographic engines</text></g><text class="ds" x="258" y="392">Additional hard functions: TRNG · PUF · eFUSE and device controls</text><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="Programmable logic" data-arch="Our actual PL design contains MicroBlaze-V, BRAM, UART, a cycle counter and the PMC bridge. There is no claimed LED authorization gate in this delivered payload."><rect x="930" y="70" width="210" height="90" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="946" y="99" class="dt">Programmable logic</text><text x="946" y="122" class="ds">MicroBlaze-V + UART</text></g><g class="diagram-hot" role="button" tabindex="0" aria-pressed="false" data-label="PMC Bridge / AXI32" data-arch="The functional test application reaches PMC crypto services through the PL interface. It is distinct from the native-PMC performance firmware."><rect x="930" y="225" width="210" height="90" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="946" y="254" class="dt">PMC Bridge / AXI32</text><text x="946" y="277" class="ds">PL access to PMC services</text></g><path d="M210 115 L253 115" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M543 110 L573 110" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M874 110 L925 110" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M400 150 L400 180" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M726 150 L726 180" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M400 250 L400 277" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M726 250 L726 277" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M543 322 L573 322" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M925 270 L879 220" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1035 160 L1035 220" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/></svg>