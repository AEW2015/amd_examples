<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-label="Runtime PL application control and data path"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c80"/></marker></defs><style>.dt{font:600 18px Segoe UI,Arial;fill:#16374e}.ds{font:14px Segoe UI,Arial;fill:#425e74}.dl{font:600 24px Segoe UI,Arial;fill:#16374e}</style><g><rect x="15" y="25" width="250" height="80" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="31" y="54" class="dt">PL application</text><text x="31" y="77" class="ds">MicroBlaze-V + initialized BRAM</text></g><g><rect x="325" y="25" width="260" height="80" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="341" y="54" class="dt">PMC Bridge / AXI32</text><text x="341" y="77" class="ds">Memory-mapped service access</text></g><g><rect x="645" y="25" width="425" height="80" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="661" y="54" class="dt">PMC crypto + DMA</text><text x="661" y="77" class="ds">Hardened SHA3/SHAKE/AES + software control</text></g><g><rect x="325" y="180" width="260" height="80" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="341" y="209" class="dt">Owned shared buffers</text><text x="341" y="232" class="ds">Input / output / digest / tag</text></g><g><rect x="15" y="180" width="250" height="80" rx="9" fill="#d4eee2" stroke="#9eb5c8"/><text x="31" y="209" class="dt">UART → host notebook</text><text x="31" y="232" class="ds">Capture and exact-result checks</text></g><path d="M265 65 L320 65" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M585 65 L640 65" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M455 110 L455 175" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M645 87 L585 210" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M140 110 L140 175" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><text class="ds" x="645" y="215">Functional path: PL software + PMC hardware</text><text class="ds" x="645" y="242">Fast benchmark: separate firmware on native PMC</text><text class="ds" x="15" y="294">Payloads are generated by firmware. This is not an arbitrary-file upload service.</text></svg>