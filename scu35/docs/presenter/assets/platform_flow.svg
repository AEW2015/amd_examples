<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 265" role="img" aria-label="Vivado design to XSA to Vitis platform and application"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c80"/></marker></defs><style>.dt{font:600 18px Segoe UI,Arial;fill:#16374e}.ds{font:14px Segoe UI,Arial;fill:#425e74}.dl{font:600 24px Segoe UI,Arial;fill:#16374e}</style><g><rect x="20" y="30" width="330" height="85" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="36" y="59" class="dt">Vivado IPI design</text><text x="36" y="82" class="ds">CPU + memory + PMC + UART + timer</text></g><g><rect x="420" y="30" width="310" height="85" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="436" y="59" class="dt">XSA hardware handoff</text><text x="436" y="82" class="ds">Processor / addresses / hardware</text></g><g><rect x="800" y="30" width="350" height="85" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="816" y="59" class="dt">Vitis platform + BSP</text><text x="816" y="82" class="ds">Standalone domain / drivers / libraries</text></g><g><rect x="800" y="165" width="350" height="75" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="816" y="194" class="dt">AMD example application</text><text x="816" y="217" class="ds">Build an ELF for the mb domain</text></g><path d="M350 73 L415 73" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M730 73 L795 73" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M975 120 L975 160" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><text x="20" y="190" class="ds">Build the platform before compiling the example.</text><text x="20" y="219" class="ds">Importing an XSA does not program the FPGA.</text></svg>