<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">Tested SCU35 Ethernet crypto design</title><desc id="desc">Direct Ethernet connects host Python to AXI Ethernet Lite. MicroBlaze V copies packet data through the PMC Bridge into owned shared RAM; hardened PMC DMA feeds AES and SHA. AXI Timer measures device work. No streaming AXI DMA core is present.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#3a6478"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17384c}.head{font-size:21px;font-weight:650}.sub{font-size:14px}.label{font-size:12px;fill:#466579}.box{fill:#eef6fa;stroke:#86a8b8;stroke-width:1.5}.hard{fill:#eaf5e7;stroke:#83aa78;stroke-width:1.5}.line{stroke:#3a6478;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="440" rx="12" fill="#fff"/><text x="35" y="35" class="head">Complete example: Ethernet Lite + MicroBlaze V + hardened PMC crypto</text><rect x="218" y="70" width="865" height="285" rx="12" fill="#f7fafc" stroke="#b1c6cf"/><text x="240" y="96" class="label">SCU35 · AMD catalog IP in the IPI design</text><rect x="25" y="155" width="145" height="105" rx="8" class="box"/><text x="97" y="187" text-anchor="middle" class="head">Host Python</text><text x="97" y="213" text-anchor="middle" class="sub">UDP + validation</text><text x="97" y="237" text-anchor="middle" class="label">192.168.10.1</text><rect x="245" y="155" width="190" height="105" rx="8" class="box"/><text x="340" y="184" text-anchor="middle" class="head">Ethernet Lite</text><text x="340" y="210" text-anchor="middle" class="sub">MII · 100 Mb/s PHY</text><text x="340" y="235" text-anchor="middle" class="label">RX/TX ping-pong RAM</text><rect x="490" y="155" width="180" height="105" rx="8" class="box"/><text x="580" y="184" text-anchor="middle" class="head">MicroBlaze V</text><text x="580" y="210" text-anchor="middle" class="sub">128 KiB local BRAM</text><text x="580" y="235" text-anchor="middle" class="label">packet/control firmware</text><rect x="735" y="129" width="310" height="164" rx="8" class="hard"/><text x="890" y="157" text-anchor="middle" class="head">PMC security hardware</text><text x="890" y="186" text-anchor="middle" class="sub">Owned shared RAM</text><text x="890" y="213" text-anchor="middle" class="sub">PMC DMA / secure stream switch</text><text x="890" y="242" text-anchor="middle" class="head">AES-GCM · SHA3 / SHAKE</text><text x="890" y="273" text-anchor="middle" class="label">Public diagnostic AES key · volatile only</text><path d="M170 207H241" class="line"/><text x="205" y="180" text-anchor="middle" class="label">Ethernet</text><path d="M435 207H486" class="line"/><text x="460" y="183" text-anchor="middle" class="label">AXI-Lite</text><path d="M670 207H731" class="line"/><text x="701" y="179" text-anchor="middle" class="label">PMC Bridge</text><text x="701" y="236" text-anchor="middle" class="label">CPU copies</text><rect x="490" y="305" width="180" height="34" rx="5" class="box"/><text x="580" y="328" text-anchor="middle" class="sub">AXI Timer · 100 MHz</text><path d="M580 305V264" class="line"/><text x="35" y="388" class="sub">Reply returns over Ethernet; Python verifies payload/digest and AES-GCM tags.</text><text x="35" y="417" class="label">Delivered image: no AXI DMA IP or HyperRAM. JTAG loads the PDI; measured user payloads travel over Ethernet.</text></svg>
