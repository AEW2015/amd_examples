<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-label="Actual sys IPI connections: MicroBlaze V, local BRAM and PMC AXI bridge"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c80"/></marker></defs><style>.dt{font:600 18px Segoe UI,Arial;fill:#16374e}.ds{font:14px Segoe UI,Arial;fill:#425e74}.dl{font:600 24px Segoe UI,Arial;fill:#16374e}</style><rect x="8" y="8" width="1160" height="460" rx="16" fill="#f5f8fc" stroke="#9eb5c8"/><text x="28" y="43" class="dl">sys / SCU35 programmable logic — 100 MHz</text><g><rect x="35" y="85" width="250" height="82" rx="9" fill="#f7e6ca" stroke="#9eb5c8"/><text x="51" y="114" class="dt">mb / MicroBlaze V</text><text x="51" y="137" class="ds">PL processor; runs bench.elf</text></g><g><rect x="35" y="220" width="250" height="82" rx="9" fill="#e1dcf5" stroke="#9eb5c8"/><text x="51" y="249" class="dt">mb_local_memory</text><text x="51" y="272" class="ds">128 KiB via ILMB / DLMB</text></g><g><rect x="365" y="85" width="255" height="82" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="381" y="114" class="dt">axi / AXI interconnect</text><text x="381" y="137" class="ds">S00_AXI from mb/M_AXI_DP</text></g><g><rect x="720" y="85" width="395" height="82" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="736" y="114" class="dt">pmc / PMC bridge</text><text x="736" y="137" class="ds">M01_AXI → pmc/S_AXI</text></g><g><rect x="720" y="220" width="185" height="82" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="736" y="249" class="dt">uart</text><text x="736" y="272" class="ds">M00_AXI → S_AXI</text></g><g><rect x="930" y="220" width="185" height="82" rx="9" fill="#d6e9f5" stroke="#9eb5c8"/><text x="946" y="249" class="dt">timer / AXI GPIO</text><text x="946" y="272" class="ds">M02_AXI → S_AXI</text></g><g><rect x="365" y="350" width="750" height="78" rx="9" fill="#d3eee4" stroke="#9eb5c8"/><text x="381" y="379" class="dt">Hardened PMC functions beyond the bridge</text><text x="381" y="402" class="ds">DMA • SHA3 / SHAKE • AES • PUF • TRNG • configuration controls</text></g><path d="M285 126 L360 126" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M160 170 L160 215" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M620 126 L715 126" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M490 170 L490 260" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M490 260 L715 260" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1135 126 L1135 389" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1135 389 L1120 389" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M490 195 L1022 195 L1022 215" fill="none" stroke="#526c80" stroke-width="2.5" marker-end="url(#arr)"/><text x="35" y="351" class="ds">Also present: mdm_1 debug, reset logic,</text><text x="35" y="376" class="ds">cycles_0 counter and constants.</text><text x="35" y="444" class="ds">Source-derived schematic. Hardened PMC functions are outside the PL netlist; the bridge exposes access.</text></svg>